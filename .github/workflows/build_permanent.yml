name: 🚀 Build Permanent Vendor Assets
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ضروري جداً للسماح للأكشن بإنشاء Release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. تثبيت مكتبات النظام لضمان نجاح بناء مكتبة Manim
      - name: "Install System Build Dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3-dev \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config \
            libffi-dev \
            libpangocairo-1.0-0

      # 2. تشغيل السكربت لإنشاء ملف vendor_assets.zip (200MB+)
      - name: Download and Build Arsenal
        run: python setup_assets.py

      # 3. رفع الملف كـ Release (الحل البديل لـ git push)
      - name: Create Release and Upload Arsenal
        uses: softprops/action-gh-release@v2
        with:
          tag_name: arsenal-v1 # الوسم الذي سنستخدمه لتحميل الملف لاحقاً
          name: "Arsenal Assets v1.0"
          body: "تحتوي هذه النسخة على كافة المكتبات والمتصفحات اللازمة للتشغيل (Manim, Playwright, Camoufox)"
          draft: false
          prerelease: false
          files: vendor_assets.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # توكن تلقائي من GitHub
