name: 🚀 Build Permanent Vendor Assets
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. تثبيت مكتبات النظام أولاً (الخطوة الأهم)
      - name: "Install System Build Dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3-dev \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config \
            libffi-dev \
            libpangocairo-1.0-0

      # 2. الآن تشغيل السكربت بعد جاهزية البيئة
      - name: Download and Build Arsenal
        run: python setup_assets.py

      - name: Commit and Push Assets
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add vendor_assets.zip
          git commit -m "Update arsenal with Manim dependencies" || echo "No changes to commit"
          git push
