name: "Ultimate AI Video Production"

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'ما هو موضوع الفيديو؟'
        required: true
        default: 'ما هو الـ DNS؟'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # ضروري لتشغيل ومراقبة Workflows أخرى

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      # 1. فك الترسانة (توفر كافة مكتبات Python والمتصفحات)
      - name: "Unpack Arsenal"
        run: |
          if [ -f "vendor_assets.zip" ]; then
            unzip -q vendor_assets.zip -d .
            echo "✅ الترسانة جاهزة!"
          else
            echo "❌ ملف vendor_assets.zip غير موجود!"
            exit 1
          fi

      # 2. تثبيت تبعات النظام الضرورية لـ Manim فقط
      - name: "Install System Dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config fonts-freefont-ttf fonts-kacst fonts-noto-core

      # 3. تشغيل خدمة Gemini API وانتظار النتيجة (المرحلة 1)
      - name: "Phase 1: Get Script from Gemini API"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 استدعاء Gemini API..."
          gh workflow run gemini_api.yml -f prompt="أريد سكريبت فيديو عن ${{ github.event.inputs.prompt }}. أخرج النتيجة حصرياً بصيغة JSON كقائمة تحتوي على 3 كائنات."
          
          sleep 10
          RUN_ID=$(gh run list --workflow gemini_api.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "📡 مراقبة العملية: $RUN_ID"
          
          gh run watch $RUN_ID
          
          # تحميل النتيجة result.json
          gh run download $RUN_ID -n gemini-json
          echo "✅ تم استلام السيناريو."

      # 4. رندر الفيديو باستخدام مكتبات الترسانة (المرحلة 2)
      - name: "Phase 2: Render Video"
        run: |
          # إضافة مسار مكتبات الترسانة لمسار بايثون
          export PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/python
          python main_pipeline.py

      # 5. الأرشفة والرفع (المرحلة 3)
      - name: "Phase 3: Archive and Upload"
        run: |
          git config --global user.name "VideoBot"
          git config --global user.email "bot@video.com"
          
          VIDEO_FILE=$(find media/videos -name "*.mp4" | head -n 1)
          
          if [ -n "$VIDEO_FILE" ]; then
            mkdir -p output_videos
            cp "$VIDEO_FILE" output_videos/final_video.mp4
            git add output_videos/final_video.mp4
            git commit -m "🎬 New Video: ${{ github.event.inputs.prompt }}"
            git push
          else
            echo "❌ No video found."
            exit 1
          fi

      - name: "Upload Final Video Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ai-generated-video
          path: output_videos/final_video.mp4
