name: "Ultimate AI Video Production"

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'ما هو موضوع الفيديو؟'
        required: true
        default: 'ما هو الـ DNS؟'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # تم إزالة خاصية الـ cache هنا لأن الملفات غير موجودة بمستودعك

      - name: "Install System Dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config fonts-freefont-ttf fonts-kacst fonts-noto-core

      - name: "Install Python Libraries"
        run: |
          python -m pip install --upgrade pip
          pip install manim edge-tts mutagen arabic-reshaper python-bidi camoufox requests playwright
          # تثبيت المتصفح مع كافة التبعات لضمان عمل Camoufox
          python -m playwright install --with-deps chromium firefox

      - name: "Phase 1 AI Director"
        env:
          GEMINI_COOKIES: ${{ secrets.GEMINI_COOKIES }}
          USER_PROMPT: ${{ github.event.inputs.prompt }}
        run: |
          # تأكد أن ملف main.py موجود في المجلد الرئيسي للمستودع
          python main.py "أريد سكريبت فيديو عن $USER_PROMPT. أخرج النتيجة حصرياً بصيغة JSON كقائمة تحتوي على 3 كائنات."

      - name: "Phase 2 Render Video"
        run: |
          # تأكد أن ملف main_pipeline.py موجود في المجلد الرئيسي للمستودع
          python main_pipeline.py

      - name: "Phase 3 Archive and Upload"
        run: |
          git config --global user.name "VideoBot"
          git config --global user.email "bot@video.com"
          
          # البحث عن الفيديو في المجلد الافتراضي لـ Manim
          VIDEO_FILE=$(find media/videos -name "*.mp4" | head -n 1)

         
      
          if [ -n "$VIDEO_FILE" ]; then
            mkdir -p output_videos
            cp "$VIDEO_FILE" output_videos/final_video.mp4
            git add output_videos/final_video.mp4
            git commit -m "🎬 New Video: ${{ github.event.inputs.prompt }}"
            git push
          else
            echo "❌ No video found. Check Phase 2 logs."
            exit 1
          fi

# أضف هذا الجزء في نهاية ملف ai_video_maker.yml
      - name: "Upload Final Video"
        uses: actions/upload-artifact@v4
        with:
          name: ai-generated-video
          path: output_videos/final_video.mp4
   
