name: "🚀 Ultimate AI Video Production"

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'ما هو موضوع الفيديو؟'
        required: true
        default: 'ما هو الـ DNS؟'

jobs:
  production:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      id-token: write

    steps:
      - name: "📦 Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # لجلب كامل التاريخ لضمان نجاح الـ Push

      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --- إدارة الترسانة (Arsenal Management) ---
      - name: "📂 Restore Arsenal Cache"
        id: cache-arsenal
        uses: actions/cache@v4
        with:
          path: vendor_extracted
          key: arsenal-v1-cache-${{ runner.os }}

      - name: "📥 Download & Setup Arsenal (If Cache Miss)"
        if: steps.cache-arsenal.outputs.cache-hit != 'true'
        run: |
          echo "🌐 Downloading Release Asset..."
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -o vendor_assets.zip \
               "https://github.com/${{ github.repository }}/releases/download/arsenal-v1/vendor_assets.zip"
          
          echo "📦 Unzipping Arsenal..."
          unzip -q vendor_assets.zip -d vendor_extracted
          
          echo "🔑 Fixing Permissions..."
          find vendor_extracted -type f -name "node" -exec chmod +x {} +
          find vendor_extracted -type f -name "chrome" -exec chmod +x {} +
          find vendor_extracted -type f -name "firefox" -exec chmod +x {} +
          chmod -R +x vendor_extracted/python/bin 2>/dev/null || true

      # --- بيئة الرندر (Rendering Environment) ---
      - name: "🛠️ Install System Dependencies (Manim Core)"
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config \
          fonts-freefont-ttf fonts-kacst fonts-noto-core texlive texlive-fonts-extra

      # --- المرحلة الأولى: الذكاء الاصطناعي ---
      - name: "🤖 Phase 1: Script Generation (Gemini)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📡 Triggering Gemini Workflow..."
          gh workflow run gemini_api.yml -f prompt="${{ github.event.inputs.prompt }}"
          
          echo "⏳ Waiting for Gemini to think..."
          sleep 20 # زيادة وقت الانتظار لضمان التسجيل
          
          RUN_ID=$(gh run list --workflow gemini_api.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "🔍 Monitoring Run ID: $RUN_ID"
          
          gh run watch $RUN_ID
          
          # التحقق من نجاح العملية
          CONCLUSION=$(gh run view $RUN_ID --json conclusion --jq '.conclusion')
          if [ "$CONCLUSION" != "success" ]; then
            echo "❌ Gemini API Workflow failed!"
            exit 1
          fi
          
          gh run download $RUN_ID -n gemini-json
          echo "✅ Script received successfully."

      # --- المرحلة الثانية: صناعة الفيديو ---
      - name: "🎬 Phase 2: Rendering Video (Manim)"
        run: |
          # حقن المسارات في بيئة النظام
          export PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/vendor_extracted/python
          export PLAYWRIGHT_BROWSERS_PATH=${{ github.workspace }}/vendor_extracted/browsers
          export PATH=$PATH:${{ github.workspace }}/vendor_extracted/python/bin
          
          echo "⚙️ Starting Main Pipeline..."
          python main_pipeline.py

      # --- المرحلة الثالثة: الحفظ والنشر ---
      - name: "📤 Phase 3: Archive & Push"
        if: always()
        run: |
          git config --global user.name "AI-Video-Bot"
          git config --global user.email "bot@ai-video.com"
          
          # البحث عن ملف الفيديو الناتج
          VIDEO_PATH=$(find media/videos -name "*.mp4" | head -n 1)
          
          if [ -n "$VIDEO_PATH" ]; then
            echo "✅ Video found at: $VIDEO_PATH"
            mkdir -p final_outputs
            cp "$VIDEO_PATH" final_outputs/video_$(date +%Y%m%d_%H%M%S).mp4
            
            # محاولة الرفع للمستودع (اختياري)
            git add final_outputs/
            git commit -m "🎬 Generated: ${{ github.event.inputs.prompt }}" || echo "No changes to commit"
            git push origin main || echo "Push failed, but video is safe in artifacts."
          else
            echo "⚠️ No video file generated."
          fi

      - name: "🎁 Final Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Full-Production-Package
          path: |
            final_outputs/
            result.json
            error_debug.png
