name: Ultimate AI Video Production

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'ما هو موضوع الفيديو؟'
        required: true
        default: 'ما هو الـ DNS؟'

jobs:
  build:
    runs-on: ubuntu-latest
    # ميزة: السماح للأكشن بالكتابة في المستودع
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config

      - name: Install Python Libraries
        run: |
          pip install manim edge-tts mutagen arabic-reshaper python-bidi camoufox requests

      - name: Phase 1: AI Director (Extracting Script)
        env:
          GEMINI_COOKIES: ${{ secrets.GEMINI_COOKIES }}
          # تمرير المدخلات كمتغير بيئة لتجنب أخطاء الـ YAML Syntax
          USER_PROMPT: ${{ github.event.inputs.prompt }}
        run: |
          # الآن ندمج النص داخل لغة Bash وليس داخل YAML مباشرة
          FINAL_PROMPT="أريد سكريبت فيديو عن $USER_PROMPT. أخرج النتيجة حصرياً بصيغة JSON كقائمة تحتوي على 3 كائنات، كل كائن يحتوي على (text: الجملة بالعربي، highlight: كلمة مميزة، color: اسم لون RED أو BLUE أو YELLOW). لا تكتب أي نصوص خارج المصفوفة."
          python main.py "$FINAL_PROMPT"

      - name: Phase 2: Render Video (Visual Engine)
        run: |
          python main_pipeline.py

      - name: Phase 3: Archive and Upload Video
        run: |
          git config --global user.name "VideoBot"
          git config --global user.email "bot@video.com"
          
          # البحث عن أي ملف mp4 تم إنتاجه
          VIDEO_FILE=$(find media/videos -name "*.mp4" | head -n 1)
          
          if [ -f "$VIDEO_FILE" ]; then
            mkdir -p output_videos
            cp "$VIDEO_FILE" output_videos/final_video.mp4
            git add output_videos/final_video.mp4
            git commit -m "🎬 New Video: ${{ github.event.inputs.prompt }}"
            git push
          else
            echo "❌ No video found."
            exit 1
          fi
